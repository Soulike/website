name: Game 2048 Docker Image Build and Push

on:
  push:
    branches:
      - 'main'
    paths:
      - 'apps/web/game-2048/**'
      - 'libraries/**'
      - 'configs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/smoke/**'
      - '.github/workflows/docker-image-build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/docker-image-build-and-push.yml
    secrets: inherit
    with:
      docker-file-path: ./apps/web/game-2048/Dockerfile
      docker-build-target: game-2048
      smoke-script: .github/scripts/smoke/game-2048-web.ts
      push-to-registry: true
