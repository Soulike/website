name: Apps CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Report tool versions
        run: |
          node --version
          pnpm --version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PR
        run: pnpm validate:pr
      - name: Test
        run: pnpm test
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'libraries/**'
              - 'configs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/scripts/smoke-image.sh'
              - '.github/workflows/apps-ci.yml'
              - '.github/workflows/*docker-image-build-and-push.yml'
            blog:
              - 'apps/web/blog-vite/**'
              - 'modules/**'
            admin:
              - 'apps/web/admin-vite/**'
              - 'modules/**'
            game-2048:
              - 'apps/web/game-2048/**'
            auth-server:
              - 'apps/server/auth/**'
              - 'modules/**'
            admin-server-legacy:
              - 'apps/server/admin-legacy/**'
              - 'modules/**'
            blog-server-legacy:
              - 'apps/server/blog-legacy/**'
              - 'modules/**'
            database-server-legacy:
              - 'apps/server/database-legacy/**'
              - 'modules/**'
      - name: Build matrix
        id: build-matrix
        run: |
          matrix='[]'
          add() { matrix=$(echo "$matrix" | jq -c --arg t "$1" --arg p "$2" --arg s "${3:-none}" '. + [{"docker-build-target": $t, "docker-file-path": $p, "smoke-profile": $s}]'); }

          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            add blog ./apps/web/blog-vite/Dockerfile web
            add admin ./apps/web/admin-vite/Dockerfile web
            add game-2048 ./apps/web/game-2048/Dockerfile web
            add auth-server ./apps/server/auth/Dockerfile postgres-redis-server
            add admin-server-legacy ./apps/server/admin-legacy/Dockerfile redis-server
            add blog-server-legacy ./apps/server/blog-legacy/Dockerfile standalone-server
            add database-server-legacy ./apps/server/database-legacy/Dockerfile postgres-server
          else
            [ "${{ steps.filter.outputs.blog }}" = "true" ] && add blog ./apps/web/blog-vite/Dockerfile web
            [ "${{ steps.filter.outputs.admin }}" = "true" ] && add admin ./apps/web/admin-vite/Dockerfile web
            [ "${{ steps.filter.outputs.game-2048 }}" = "true" ] && add game-2048 ./apps/web/game-2048/Dockerfile web
            [ "${{ steps.filter.outputs.auth-server }}" = "true" ] && add auth-server ./apps/server/auth/Dockerfile postgres-redis-server
            [ "${{ steps.filter.outputs.admin-server-legacy }}" = "true" ] && add admin-server-legacy ./apps/server/admin-legacy/Dockerfile redis-server
            [ "${{ steps.filter.outputs.blog-server-legacy }}" = "true" ] && add blog-server-legacy ./apps/server/blog-legacy/Dockerfile standalone-server
            [ "${{ steps.filter.outputs.database-server-legacy }}" = "true" ] && add database-server-legacy ./apps/server/database-legacy/Dockerfile postgres-server
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: [test, changes]
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/docker-image-build-and-push.yml
    secrets: inherit
    with:
      docker-file-path: ${{ matrix.docker-file-path }}
      docker-build-target: ${{ matrix.docker-build-target }}
      smoke-profile: ${{ matrix.smoke-profile }}
      push-to-registry: false
  ci-success:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - changes
      - build
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo Done!
