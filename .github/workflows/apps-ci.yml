name: Apps CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Report tool versions
        run: |
          node --version
          pnpm --version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PR
        run: pnpm validate:pr
      - name: Test
        run: pnpm test
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'libraries/**'
              - 'configs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/scripts/smoke/**'
              - '.github/workflows/apps-ci.yml'
              - '.github/workflows/*docker-image-build-and-push.yml'
            blog:
              - 'apps/web/blog-vite/**'
              - 'modules/**'
            admin:
              - 'apps/web/admin-vite/**'
              - 'modules/**'
            game-2048:
              - 'apps/web/game-2048/**'
            auth-server:
              - 'apps/server/auth/**'
              - 'modules/**'
            admin-server-legacy:
              - 'apps/server/admin-legacy/**'
              - 'modules/**'
            blog-server-legacy:
              - 'apps/server/blog-legacy/**'
              - 'modules/**'
            database-server-legacy:
              - 'apps/server/database-legacy/**'
              - 'modules/**'
      - name: Setup Node.js for matrix
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
      - name: Build matrix
        id: build-matrix
        env:
          FILTER_RESULTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          echo "matrix=$(node .github/scripts/smoke/build-matrix.ts)" >> "$GITHUB_OUTPUT"
  build:
    needs: [test, changes]
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/docker-image-build-and-push.yml
    secrets: inherit
    with:
      docker-file-path: ${{ matrix.docker-file-path }}
      docker-build-target: ${{ matrix.docker-build-target }}
      smoke-script: ${{ matrix.smoke-script }}
      push-to-registry: false
  ci-success:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - changes
      - build
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo Done!
