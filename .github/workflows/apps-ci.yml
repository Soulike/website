name: Apps CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Report tool versions
        run: |
          node --version
          pnpm --version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PR
        run: pnpm validate:pr
      - name: Test
        run: pnpm test
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Rules are ORed; exclude instruction basenames within each directory glob.
            shared:
              - 'libraries/**/!(AGENTS.md|CLAUDE.md)'
              - 'configs/**/!(AGENTS.md|CLAUDE.md)'
              - 'scripts/node-version/**/!(AGENTS.md|CLAUDE.md)'
              - '.node-version'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/scripts/smoke/**/!(AGENTS.md|CLAUDE.md)'
              - '.github/workflows/apps-ci.yml'
              - '.github/workflows/*docker-image-build-and-push.yml'
            blog:
              - 'apps/web/blog-vite/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
            admin:
              - 'apps/web/admin-vite/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
            game-2048:
              - 'apps/web/game-2048/**/!(AGENTS.md|CLAUDE.md)'
            auth-server:
              - 'apps/server/auth/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
            admin-server-legacy:
              - 'apps/server/admin-legacy/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
            blog-server-legacy:
              - 'apps/server/blog-legacy/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
            database-server-legacy:
              - 'apps/server/database-legacy/**/!(AGENTS.md|CLAUDE.md)'
              - 'modules/**/!(AGENTS.md|CLAUDE.md)'
      - name: Setup Node.js for matrix
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
      - name: Build matrix
        id: build-matrix
        env:
          FILTER_RESULTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          node scripts/node-version/src/check-runtime.ts
          echo "matrix=$(node .github/scripts/smoke/build-matrix.ts)" >> "$GITHUB_OUTPUT"
  build:
    needs: [test, changes]
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/docker-image-build-and-push.yml
    secrets: inherit
    with:
      docker-file-path: ${{ matrix.docker-file-path }}
      docker-build-target: ${{ matrix.docker-build-target }}
      smoke-script: ${{ matrix.smoke-script }}
      push-to-registry: false
  ci-success:
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs:
      - test
      - changes
      - build
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo Done!
