name: Admin Docker Image Build and Push

on:
  push:
    branches:
      - 'main'
    paths:
      - 'apps/web/admin-vite/**'
      - 'modules/**'
      - 'libraries/**'
      - 'configs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/smoke/**'
      - '.github/workflows/docker-image-build-and-push.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/docker-image-build-and-push.yml
    secrets: inherit
    with:
      docker-file-path: ./apps/web/admin-vite/Dockerfile
      docker-build-target: admin
      smoke-script: .github/scripts/smoke/admin-web.ts
      push-to-registry: true
