name: Docker Image Build & Push

on:
  workflow_call:
    inputs:
      docker-build-target:
        required: true
        type: string
      docker-file-path:
        required: true
        type: string
      push-to-registry:
        required: true
        type: boolean
      smoke-profile:
        required: false
        type: string
        default: none

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCAL_IMAGE: local/${{ inputs.docker-build-target }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.docker-file-path }}
          target: ${{ inputs.docker-build-target }}
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke image
        if: inputs.smoke-profile != 'none'
        run: .github/scripts/smoke-image.sh "${{ inputs.smoke-profile }}" "$LOCAL_IMAGE"
      - name: Login to Docker Hub
        if: inputs.push-to-registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: inputs.push-to-registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          remote_image="$DOCKERHUB_USERNAME/${{ inputs.docker-build-target }}:latest"
          docker tag "$LOCAL_IMAGE" "$remote_image"
          docker push "$remote_image"
